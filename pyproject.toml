[build-system]
requires = ["hatchling >= 1.26", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.version]
source = "vcs"

[tool.pyright]
reportMissingImports = "none"

[project]
name = "crystalbuilder"
authors = [{name = "Brandon Hacha"}]
dynamic = ["version"]
description= 'A package for building 3D photonic crystals'
readme = "README.rst"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "vedo",
    "beautifulsoup4",
    "requests",
    "trimesh[recommend]"
]

[project.optional-dependencies]
full = ['tidy3d']

[project.scripts]
bilbao-cli = "crystalbuilder.utilities.bilbao_resource_fetcher:download_bilbao_data"